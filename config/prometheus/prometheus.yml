# Prometheus compartido. Si una herramienta no está instalada, su target aparece como «down» y no afecta al resto.
global:
  scrape_interval: 15s

scrape_configs:
  # ------------------------------------------------ Claude Code (perfil claude)
  - job_name: "claude-code"
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: "claude-collector"
    static_configs:
      - targets: ["claude-collector:9100"]

  # ------------------------------------------------ OpenCode (perfil opencode)
  - job_name: "opencode"
    # El colector lee la base de datos de OpenCode a través de un bind mount, lento en Windows
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ["opencode-collector:9101"]
