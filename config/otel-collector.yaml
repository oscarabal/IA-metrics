receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Expone las métricas para que Prometheus las recoja
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 24h   # por defecto 5m: sin esto las series desaparecen de :8889 a los 5 min de cerrar Claude Code
    resource_to_telemetry_conversion:
      enabled: true        # convierte team, department, user... en etiquetas
  # Para depurar lo que llega, añade un exportador `debug: {verbosity: basic}` y ponlo en los
  # pipelines. No se deja activo: escribe en el log cada lote recibido.
  # Guarda los eventos (api_request, tool_result, skill_activated...) en Loki
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  # Métricas internas en :8888 (solo en la red interna) para el panel «Estado de las fuentes»: cuánta
  # telemetría llega, cuánta se rechaza y cuánta no se pudo enviar a Loki. Por defecto solo escuchan en localhost.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
